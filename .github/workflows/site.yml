# Builds the site as it is served: the pages plus the fonts from npm. A tag v* publishes
# the build as site.tar.gz in a release, which the bot downloads and serves.
name: site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sh tools/fonts.sh
      - name: check
        run: |
          for f in index.html impressum.html datenschutz.html discord-bot.html en/imprint.html en/privacy.html en/discord-bot.html; do test -s "$f"; done
          node --check js/galaxy.js
          node --check js/status.js
          for f in *.html en/*.html; do
            grep -o 'href="[^"#:]*"\|src="[^"#:]*"' "$f" | sed 's/.*="\(.*\)"/\1/' | while read -r p; do test -e "$(dirname "$f")/$p" || { echo "missing in $f: $p"; exit 1; }; done
          done
      - name: package
        run: |
          mkdir -p dist && cp -r *.html en favicon.svg css js fonts img dist/
          tar -czf site.tar.gz -C dist .
          sha256sum site.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            site.tar.gz
            SHA256SUMS
