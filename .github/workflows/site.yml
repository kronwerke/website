# Builds the site as it is served: the pages, the fonts from npm and the mod list from the
# pack, minified and with fingerprinted addresses. A tag v* publishes the build as site.tar.gz in a release, which the bot downloads
# and serves.
name: site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh tools/fonts.sh
      - uses: actions/checkout@v4
        with:
          repository: kronwerke/pack
          path: .pack
      - name: mod list
        run: |
          pip install --quiet Pillow
          python tools/modlist.py .pack .
          test -s data/mods.json
      - name: check
        run: |
          for f in index.html questbuch.html anmelden.html qb/book.json qb/search.json stufen.html herkunft.html mods.html installieren.html streamer.html partner.html faq.html status.html overlay.html impressum.html datenschutz.html discord-bot.html en/imprint.html en/privacy.html en/discord-bot.html en/install.html en/faq.html; do test -s "$f"; done
          for f in js/*.js; do node --check "$f"; done
          # the quest book asks for its first chapter before it has the book: the name must match
          python -c "import json,sys; first=json.load(open('qb/book.json'))['chapters'][0]['name']; sys.exit(0 if 'data-first=\"%s\"' % first in open('questbuch.html').read() else 'questbuch.html: data-first is not ' + first)"
          for f in *.html en/*.html; do
            grep -o 'href="[^"#:]*"\|src="[^"#:]*"' "$f" | sed 's/.*="\(.*\)"/\1/; s/?.*//' | while read -r p; do case "$p" in whitelist/|../whitelist/|api/*|../api/*) continue;; esac; d="$(dirname "$f")"; test -e "$d/$p" || test -e "$d/$p.html" || { echo "missing in $f: $p"; exit 1; }; done
          done
      - name: package
        run: |
          # the pages as they are served: styles and scripts minified, every address
          # stamped with the fingerprint of its file (tools/build.sh)
          npm install --no-save --no-audit --no-fund esbuild@0.25.10
          PATH="$PWD/node_modules/.bin:$PATH" sh tools/build.sh dist
          test "$(wc -c < dist/css/site.css)" -lt "$(wc -c < css/site.css)"
          grep -q 'css/site.css?v=' dist/index.html
          grep -q 'data-qd=' dist/questbuch.html
          tar -czf site.tar.gz -C dist .
          sha256sum site.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            site.tar.gz
            SHA256SUMS
