# Builds the site as it is served: the pages, the fonts from npm and the mod list from the
# pack. A tag v* publishes the build as site.tar.gz in a release, which the bot downloads
# and serves.
name: site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh tools/fonts.sh
      - uses: actions/checkout@v4
        with:
          repository: kronwerke/pack
          path: .pack
      - name: mod list
        run: |
          pip install --quiet Pillow
          python tools/modlist.py .pack .
          test -s data/mods.json
      - name: check
        run: |
          for f in index.html stufen.html mods.html installieren.html faq.html status.html impressum.html datenschutz.html discord-bot.html en/imprint.html en/privacy.html en/discord-bot.html; do test -s "$f"; done
          for f in js/*.js; do node --check "$f"; done
          for f in *.html en/*.html; do
            grep -o 'href="[^"#:]*"\|src="[^"#:]*"' "$f" | sed 's/.*="\(.*\)"/\1/' | while read -r p; do test -e "$(dirname "$f")/$p" || { echo "missing in $f: $p"; exit 1; }; done
          done
      - name: package
        run: |
          mkdir -p dist && cp -r *.html en favicon.svg css js fonts img data dist/
          tar -czf site.tar.gz -C dist .
          sha256sum site.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            site.tar.gz
            SHA256SUMS
